name: Auto Video Clipper & Hormozi Editor

on:
  push:
    paths:
      - 'raw_videos/**'
  workflow_dispatch:

jobs:
  process-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          
      - name: Install AI & Audio Libraries
        run: |
          pip install faster-whisper requests
          
      - name: Edit, Upscale & Caption Clips
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python clip_pipeline.py
          
      - name: Package Ready-to-Post Shorts
        uses: actions/upload-artifact@v4
        with:
          name: ready-to-post-shorts
          path: output_clips/FINAL_SHORT_*.mp4
