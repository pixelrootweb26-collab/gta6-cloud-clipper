name: Cloud AI Multi-Clipper

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube or Twitch VOD URL'
        required: true

jobs:
  run-clipper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          
      - name: Install Latest yt-dlp & AI Libraries
        run: |
          pip install --upgrade yt-dlp faster-whisper requests
          
      - name: Inject YouTube Cookies
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt
          
      - name: Run AI Clipping Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VIDEO_URL: ${{ github.event.inputs.video_url }}
        run: |
          python clip_pipeline.py
          
      - name: Upload Rendered Clips Artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-viral-shorts
          path: output_clips/*.mp4
