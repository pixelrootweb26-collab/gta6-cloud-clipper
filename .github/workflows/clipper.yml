name: Cloud AI Link Clipper

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video or Stream Link'
        required: true

jobs:
  process-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg, Fonts & AI Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install --upgrade yt-dlp bgutil-ytdlp-pot-provider faster-whisper requests

      - name: Start PO Token Provider Server
        run: |
          npx --yes bgutil-ytdlp-pot-provider &
          sleep 5

      - name: Download, Clip, Upscale & Add Hormozi Captions
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          YT_DLP_POT_PROVIDER_URL: "http://127.0.0.1:4416"
        run: |
          python clip_pipeline.py

      - name: Package Ready-to-Post Shorts
        uses: actions/upload-artifact@v4
        with:
          name: ready-to-post-shorts
          path: output_clips/FINAL_SHORT_*.mp4
